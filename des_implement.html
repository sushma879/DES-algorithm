<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DES Encryption/Decryption Example</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1-crypto-js.js"></script>
</head>
<body>
<h1>DES Encryption and Decryption Example</h1>

<div>
<label for="key">Enter DES Key (8 characters):</label>
<input type="text" id="key" maxlength="8" size="8" placeholder="8 characters key"
required>
</div>

<div>
<label for="plaintext">Enter Plaintext (8 characters):</label>

<input type="text" id="plaintext" maxlength="8" size="8" placeholder="8 characters
plaintext" required>
</div>

<button onclick="encrypt()">Encrypt</button>
<button onclick="decrypt()">Decrypt</button>

<h3>Encrypted Text:</h3>
<p id="encrypted"></p>

<h3>Decrypted Text:</h3>
<p id="decrypted"></p>

<script>
function encrypt() {
var key = document.getElementById("key").value;
var plaintext = document.getElementById("plaintext").value;

if (key.length != 8 || plaintext.length != 8) {
alert("Key and Plaintext must be exactly 8 characters.");
return;
}

// Encrypt the plaintext using DES and the key
var ciphertext = CryptoJS.DES.encrypt(plaintext, key).toString();

// Display the encrypted text
document.getElementById("encrypted").innerText = ciphertext;
}

function decrypt() {
var key = document.getElementById("key").value;
var ciphertext = document.getElementById("encrypted").innerText;

if (key.length != 8 || ciphertext == "") {
alert("Key must be exactly 8 characters, and ciphertext must be available.");
return;
}

// Decrypt the ciphertext using DES and the key
var bytes = CryptoJS.DES.decrypt(ciphertext, key);
var decryptedText = bytes.toString(CryptoJS.enc.Utf8);

// Display the decrypted text
document.getElementById("decrypted").innerText = decryptedText;
}
</script>
</body>
</html>
